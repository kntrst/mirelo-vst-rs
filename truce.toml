# "EQ", "Filter", "Mastering", "Modulation", "Pitch Shift",
# "Reverb", "Surround", "Analyzer", "Spatial". Leave as "Tools" for
# generic utilities. Without this, Cubase buckets the myplugin under
# "Other".
