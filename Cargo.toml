[package]
name = "mirelo-vst-rs"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[[bin]]
name = "mirelo-vst-rs-standalone"
path = "src/main.rs"
required-features = ["standalone"]


[features]
default = ["clap", "vst3", "vst2","standalone"]
clap = ["dep:truce-clap", "dep:clap-sys"]
vst3 = ["dep:truce-vst3"]
vst2 = ["dep:truce-vst2"]
standalone = ["dep:truce-standalone"]
shell = ["truce/shell"]

rt-paranoid = ["truce/rt-paranoid"]

[dependencies]
truce = { version = "6.3" }
truce-gui-types = { version = "6.3" }
#truce-gui = { version = "6.3" }
truce-egui = { version = "6.3" }
egui =  "0.34" # older version required due to truce-egui
ureq = { version = "3", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.5", features = ["all-codecs", "all-formats"] }
arc-swap = "1"
rtrb = "0.4" # "0.3"
crossbeam-channel = "0.5"
dirs = "7" #"6"
getrandom = "0.4" #"0.3"
truce-clap = { version = "6.3", optional = true }
truce-vst3 = { version = "6.3", optional = true }
truce-vst2 = { version = "6.3", optional = true }
truce-standalone = { version = "6.3", features = ["gui"], optional = true }
clap-sys = { version = "0.5", optional = true }


[profile.shell]
inherits = "release"
